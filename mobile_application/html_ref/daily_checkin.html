<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Check-in · Mode Select</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/fontsource/fonts/nunito@latest/latin-400-normal.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/fontsource/fonts/nunito@latest/latin-600-normal.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/fontsource/fonts/nunito@latest/latin-700-normal.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/fontsource/fonts/nunito@latest/latin-800-normal.css" rel="stylesheet" />
<style>
  :root{
    --amber:#FFB534;
    --amber-deep:#E08A12;
    --coral:#FF7F50;
    --cream:#FEFCE8;
    --ink:#3A3125;
    --ink-soft:#6E6252;
    --muted:#A2947F;
    --card:#FFFFFF;
    --shadow-soft:0 14px 34px -18px rgba(178,128,40,.42), 0 3px 10px -6px rgba(178,128,40,.18);
    --shadow-lift:0 22px 44px -20px rgba(178,128,40,.50), 0 4px 14px -8px rgba(178,128,40,.22);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 700px at 12% 4%, #FFF6E0 0%, rgba(255,246,224,0) 62%),
      radial-gradient(900px 760px at 92% 96%, #FFE9DC 0%, rgba(255,233,220,0) 58%),
      linear-gradient(160deg,#FDF8EC 0%, #FBF3E4 48%, #FBEFE3 100%);
    display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;
  }

  /* ---------- Phone frame ---------- */
  .stage{display:flex;align-items:center;justify-content:center;}
  .phone{
    width:392px;height:834px;flex:0 0 auto;
    border-radius:52px;
    padding:11px;
    background:linear-gradient(150deg,#3E362B 0%,#221D16 46%,#413829 100%);
    box-shadow:
      0 60px 90px -46px rgba(84,60,20,.55),
      0 22px 44px -26px rgba(84,60,20,.35),
      inset 0 0 0 1.5px rgba(255,255,255,.10);
    transform-origin:center center;
  }
  .screen{
    position:relative;width:100%;height:100%;
    border-radius:42px;overflow:hidden;
    background:var(--cream);
    display:flex;flex-direction:column;
    isolation:isolate;
  }

  /* ambient calm blobs */
  .screen::before,.screen::after{
    content:"";position:absolute;pointer-events:none;z-index:0;border-radius:50%;
    filter:blur(46px);
  }
  .screen::before{
    width:300px;height:300px;top:-110px;right:-96px;
    background:radial-gradient(circle at 40% 40%, rgba(255,181,52,.34), rgba(255,181,52,0) 70%);
    animation:drift1 16s ease-in-out infinite;
  }
  .screen::after{
    width:340px;height:340px;bottom:-150px;left:-130px;
    background:radial-gradient(circle at 50% 50%, rgba(255,127,80,.26), rgba(255,127,80,0) 70%);
    animation:drift2 21s ease-in-out infinite;
  }
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-18px,22px,0) scale(1.08)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22px,-18px,0) scale(1.06)}}

  .screen > *{position:relative;z-index:1;}

  /* ---------- Status bar ---------- */
  .statusbar{
    height:34px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 26px 0 28px;
    font-size:13px;font-weight:800;letter-spacing:.2px;color:var(--ink);
  }
  .statusbar .sys{display:flex;align-items:center;gap:6px;}
  .statusbar svg{display:block;}

  /* ---------- App bar ---------- */
  .appbar{
    flex:0 0 auto;
    padding:10px 22px 0 16px;
    display:flex;align-items:center;gap:10px;
  }
  .icon-btn{
    width:44px;height:44px;flex:0 0 auto;border:0;background:transparent;cursor:pointer;
    border-radius:16px;display:grid;place-items:center;color:var(--ink);
    transition:background .22s ease, transform .18s ease;
  }
  .icon-btn:hover{background:rgba(255,181,52,.14);}
  .icon-btn:active{transform:scale(.92);background:rgba(255,181,52,.22);}
  .appbar h1{
    margin:0;font-size:16.5px;font-weight:700;line-height:1.25;color:var(--ink);
    letter-spacing:-.15px;
  }

  .lede{
    margin:14px 26px 0 26px;
    font-size:13.5px;line-height:1.55;color:var(--ink-soft);font-weight:600;
    max-width:290px;
  }

  /* ---------- Mode cards ---------- */
  .modes{
    flex:1 1 auto;
    display:flex;flex-direction:column;justify-content:center;
    gap:16px;
    padding:26px 22px 18px;
  }
  .mode{
    position:relative;overflow:hidden;
    width:100%;text-align:left;cursor:pointer;
    border:1.5px solid rgba(255,181,52,.26);
    border-radius:26px;
    background:linear-gradient(150deg,#FFFFFF 0%, #FFFDFA 100%);
    padding:18px 18px;
    display:flex;align-items:center;gap:16px;
    box-shadow:var(--shadow-soft);
    transition:transform .26s cubic-bezier(.22,.9,.28,1), box-shadow .26s ease,
               border-color .26s ease, background .26s ease;
    font-family:inherit;color:inherit;
    opacity:0;transform:translateY(16px);
    animation:rise .62s cubic-bezier(.22,.9,.28,1) forwards;
  }
  .mode:nth-of-type(1){animation-delay:.10s}
  .mode:nth-of-type(2){animation-delay:.20s}
  .mode:nth-of-type(3){animation-delay:.30s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  @media (hover:hover){
    .mode:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:rgba(255,181,52,.5);}
  }
  .mode:active{transform:translateY(0) scale(.985);}
  .mode.is-selected{
    border-color:rgba(255,140,60,.75);
    background:linear-gradient(150deg,#FFF8EC 0%, #FFF3E7 100%);
    box-shadow:var(--shadow-lift);
  }

  .chip{
    width:56px;height:56px;flex:0 0 auto;border-radius:20px;
    display:grid;place-items:center;
    background:linear-gradient(145deg, rgba(255,181,52,.16), rgba(255,127,80,.13));
    border:1px solid rgba(255,181,52,.30);
    transition:transform .3s cubic-bezier(.22,.9,.28,1), background .28s ease;
  }
  .mode:hover .chip{transform:translateY(-1px) rotate(-3deg) scale(1.03);}
  .mode.is-selected .chip{
    background:linear-gradient(145deg, rgba(255,181,52,.34), rgba(255,127,80,.26));
  }
  .chip svg{display:block;}

  .mode-text{flex:1 1 auto;min-width:0;}
  .mode-label{
    display:block;font-size:17px;font-weight:800;letter-spacing:-.2px;color:var(--ink);
    line-height:1.2;
  }
  .mode-desc{
    display:block;margin-top:4px;font-size:13px;font-weight:600;color:var(--muted);
    line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chev{flex:0 0 auto;color:#D8C9B2;transition:transform .26s ease, color .26s ease;}
  .mode:hover .chev{transform:translateX(3px);color:var(--amber-deep);}
  .mode.is-selected .chev{color:var(--coral);transform:translateX(3px);}

  /* ripple */
  .ripple{
    position:absolute;border-radius:50%;transform:scale(0);pointer-events:none;
    background:radial-gradient(circle, rgba(255,181,52,.42) 0%, rgba(255,127,80,.20) 60%, rgba(255,181,52,0) 72%);
    animation:rip .62s ease-out forwards;
  }
  @keyframes rip{to{transform:scale(1);opacity:0}}

  /* ---------- Microcopy + gesture ---------- */
  .foot{
    flex:0 0 auto;padding:0 30px 6px;text-align:center;
    opacity:0;animation:fadeIn .8s ease .55s forwards;
  }
  @keyframes fadeIn{to{opacity:1}}
  .foot p{
    margin:0;font-size:12px;font-weight:700;color:var(--muted);
    letter-spacing:.15px;
  }
  .foot .dot{
    display:inline-block;width:4px;height:4px;border-radius:50%;
    background:rgba(255,181,52,.75);vertical-align:middle;margin:0 8px 2px;
  }
  .gesture{
    flex:0 0 auto;height:26px;display:grid;place-items:center;padding-bottom:6px;
  }
  .gesture span{
    width:126px;height:5px;border-radius:99px;background:rgba(58,49,37,.22);
  }

  /* ---------- Toast ---------- */
  .toast{
    position:absolute;left:50%;bottom:44px;transform:translate(-50%,18px);
    display:flex;align-items:center;gap:9px;
    padding:11px 18px;border-radius:99px;
    background:rgba(58,49,37,.94);
    color:#FFF6E4;font-size:12.5px;font-weight:700;letter-spacing:.1px;
    box-shadow:0 18px 34px -18px rgba(58,49,37,.7);
    opacity:0;pointer-events:none;z-index:5;white-space:nowrap;
    transition:opacity .3s ease, transform .34s cubic-bezier(.22,.9,.28,1);
    backdrop-filter:blur(6px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast .pulse{
    width:8px;height:8px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 0 0 rgba(255,181,52,.7);animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,181,52,.6)}
    70%{box-shadow:0 0 0 9px rgba(255,181,52,0)}
    100%{box-shadow:0 0 0 0 rgba(255,181,52,0)}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    .mode{opacity:1;transform:none;}
    .foot{opacity:1;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <div class="screen">

      <!-- Status bar -->
      <div class="statusbar">
        <span>9:41</span>
        <span class="sys">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none" aria-hidden="true">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="#3A3125"/>
            <rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#3A3125"/>
            <rect x="10" y="3" width="3" height="9" rx="1" fill="#3A3125"/>
            <rect x="15" y="0.5" width="3" height="11.5" rx="1" fill="#3A3125" opacity=".35"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
            <path d="M8 11.2 10.1 8.6a3.4 3.4 0 0 0-4.2 0L8 11.2Z" fill="#3A3125"/>
            <path d="M2.9 6.1a7.6 7.6 0 0 1 10.2 0" stroke="#3A3125" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <path d="M.7 3.6a11 11 0 0 1 14.6 0" stroke="#3A3125" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".55"/>
          </svg>
          <svg width="26" height="13" viewBox="0 0 26 13" fill="none" aria-hidden="true">
            <rect x=".75" y=".75" width="21.5" height="11.5" rx="3.6" stroke="#3A3125" stroke-opacity=".45" stroke-width="1.4"/>
            <rect x="2.6" y="2.6" width="14" height="7.8" rx="2.2" fill="#3A3125"/>
            <path d="M24 4.4v4.2c1-.35 1.6-1.1 1.6-2.1s-.6-1.75-1.6-2.1Z" fill="#3A3125" fill-opacity=".45"/>
          </svg>
        </span>
      </div>

      <!-- App bar -->
      <header class="appbar">
        <button class="icon-btn" id="backBtn" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 5.5 8.2 12l6.8 6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1>How would you like to check in?</h1>
      </header>

      <p class="lede">Whatever feels easiest right now is the right one.</p>

      <!-- Three equal modes -->
      <main class="modes" id="modes">

        <button class="mode" data-mode="Text" aria-label="Text check-in">
          <span class="chip">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <defs>
                <linearGradient id="gA" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FFB534"/><stop offset="1" stop-color="#FF7F50"/>
                </linearGradient>
              </defs>
              <path d="M4 5.6A1.6 1.6 0 0 1 5.6 4h12.8A1.6 1.6 0 0 1 20 5.6v8.1a1.6 1.6 0 0 1-1.6 1.6H9.3l-4 3.3a.6.6 0 0 1-1-.46V5.6Z"
                    stroke="url(#gA)" stroke-width="1.9" stroke-linejoin="round"/>
              <path d="M8 8.4h8M8 11.6h5" stroke="url(#gA)" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="mode-text">
            <span class="mode-label">Text</span>
            <span class="mode-desc">Type how you're feeling</span>
          </span>
          <span class="chev">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9.5 5.5 6.4 6.5-6.4 6.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="mode" data-mode="Voice" aria-label="Voice check-in">
          <span class="chip">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <defs>
                <linearGradient id="gB" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FFB534"/><stop offset="1" stop-color="#FF7F50"/>
                </linearGradient>
              </defs>
              <rect x="9" y="2.6" width="6" height="11.2" rx="3" stroke="url(#gB)" stroke-width="1.9"/>
              <path d="M5.4 11.2a6.6 6.6 0 0 0 13.2 0" stroke="url(#gB)" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M12 17.8v3.4" stroke="url(#gB)" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="mode-text">
            <span class="mode-label">Voice</span>
            <span class="mode-desc">Say it out loud</span>
          </span>
          <span class="chev">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9.5 5.5 6.4 6.5-6.4 6.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="mode" data-mode="Video" aria-label="Video check-in">
          <span class="chip">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <defs>
                <linearGradient id="gC" x1="2.5" y1="5" x2="21.5" y2="19" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FFB534"/><stop offset="1" stop-color="#FF7F50"/>
                </linearGradient>
              </defs>
              <rect x="2.6" y="6.2" width="12.6" height="11.6" rx="3.4" stroke="url(#gC)" stroke-width="1.9"/>
              <path d="m15.6 12.6 4.6-3a.7.7 0 0 1 1.1.6v3.9a.7.7 0 0 1-1.1.6l-4.6-3Z"
                    stroke="url(#gC)" stroke-width="1.9" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="mode-text">
            <span class="mode-label">Video</span>
            <span class="mode-desc">Camera + voice</span>
          </span>
          <span class="chev">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9.5 5.5 6.4 6.5-6.4 6.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

      </main>

      <!-- Reassuring microcopy -->
      <footer class="foot">
        <p>You can switch anytime <span class="dot"></span> nothing is saved until you start</p>
      </footer>

      <div class="gesture"><span></span></div>

      <div class="toast" id="toast" role="status" aria-live="polite">
        <span class="pulse"></span><span id="toastText">Starting…</span>
      </div>

    </div>
  </div>
</div>

<script>
  /* Fit the device frame to any viewport */
  (function fitPhone(){
    const phone = document.getElementById('phone');
    function resize(){
      const vw = window.innerWidth, vh = window.innerHeight;
      const pad = vw < 520 ? 12 : 48;
      const scale = Math.min((vw - pad) / 392, (vh - pad) / 834, 1);
      phone.style.transform = 'scale(' + scale.toFixed(4) + ')';
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
  })();

  /* Ripple + selection + toast */
  (function interactions(){
    const cards = Array.from(document.querySelectorAll('.mode'));
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    let toastTimer = null;

    function ripple(el, ev){
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2.1;
      const x = (ev.clientX !== undefined ? ev.clientX : rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (ev.clientY !== undefined ? ev.clientY : rect.top + rect.height / 2) - rect.top - size / 2;
      const span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = x + 'px';
      span.style.top = y + 'px';
      el.appendChild(span);
      setTimeout(() => span.remove(), 640);
    }

    function showToast(msg){
      toastText.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    cards.forEach(card => {
      card.addEventListener('pointerdown', e => ripple(card, e));
      card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('is-selected'));
        card.classList.add('is-selected');
        const mode = card.dataset.mode;
        showToast('Opening ' + mode + ' check-in…');
        if (navigator.vibrate) navigator.vibrate(8);
      });
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('is-selected'));
      showToast('Back to Home');
      if (navigator.vibrate) navigator.vibrate(8);
    });
  })();
</script>
</body>
</html>
